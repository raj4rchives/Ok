<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — EXAMYWEB</title><link rel="stylesheet" href="portal.css"></head><body class="auth-body"><div class="auth-wrap"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>EXAMY<span>WEB</span></span></a><div class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Enter EXAMYWEB.</h1><p>Create an account or continue to your plan. After verified payment, you'll go straight to your study tracker.</p><form id="loginForm"><label>Name<input id="name" required placeholder="Your name"></label><label>Email<input id="email" type="email" required placeholder="you@example.com"></label><label>Exam<select id="exam"><option>JEE Main</option><option>JEE Advanced</option><option>NEET</option><option>Boards</option><option>CUET</option><option>Other</option></select></label><button class="btn primary full" type="submit">Continue to plans →</button></form><small class="auth-note">By continuing you agree to use EXAMYWEB for study tracking.</small></div><a class="back" href="index.html">← Back to EXAMYWEB</a></div><script>const q=new URLSearchParams(location.search);const plan=q.get('plan')||'starter';document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const user={name:name.value,email:email.value,exam:exam.value};localStorage.setItem('examyUser',JSON.stringify(user));location.href='checkout.html?plan='+encodeURIComponent(plan)});</script></body></html>
